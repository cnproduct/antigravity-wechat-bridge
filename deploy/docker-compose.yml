version: "3.8"

services:
  antigravity-bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: antigravity-wechat-bridge
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      # 挂载宿主机项目代码目录给 Agent 读写
      - /Users/happy/Library/CloudStorage/GoogleDrive-cnproduct@gmail.com/我的云端硬盘/WPS同步盘/diaperwebsites:/workspace
      - /Users/happy/.gemini/antigravity:/root/.gemini/antigravity
